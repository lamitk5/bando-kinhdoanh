spring:
  application:
    name: bando-spatial
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bando
    username: bando
    password: bando
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
server:
  port: 8080
  error:
    include-message: always
vision:
  worker:
    enabled: true
bando:
  reviewer:
    name: ${BANDO_REVIEWER_NAME:}
    token: ${BANDO_REVIEWER_TOKEN:}
